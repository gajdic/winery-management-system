services:
  artemis:
    image: apache/artemis:2.53.0
    container_name: artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis

  production-service:
    build:
      context: .
      dockerfile: production-service/Dockerfile
    image: winery-management/production-service:1.0.0
    container_name: production-service
    depends_on:
      - artemis
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:production-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
      SPRING_PROFILES_ACTIVE: ${PRODUCTION_SERVICE_PROFILES:-}
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: artemis

  harvest-service:
    build:
      context: .
      dockerfile: harvest-service/Dockerfile
    image: winery-management/harvest-service:1.0.0
    container_name: harvest-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:harvest-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_PROFILES_ACTIVE: ${HARVEST_SERVICE_PROFILES:-seed}

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: winery-management/inventory-service:1.0.0
    container_name: inventory-service
    depends_on:
      - artemis
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:inventory-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_PROFILES_ACTIVE: ${INVENTORY_SERVICE_PROFILES:-seed}
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: artemis

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    image: winery-management/customer-service:1.0.0
    container_name: customer-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:customer-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    depends_on:
      - customer-service
      - harvest-service
      - production-service
      - inventory-service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
