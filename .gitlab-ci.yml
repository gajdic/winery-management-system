default:
  image: maven:3.9.12-eclipse-temurin-25
  tags: [ shared-fi ]

stages:
  - test
  - build
  - docker_build
  - docker_publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_PROJECT_ID}-maven"
  paths:
    - .m2/repository

.job_template:
  only:
    - main
    - merge_requests

.docker_template:
  extends: .job_template
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]

.build_template:
  extends: .job_template
  stage: build
  script:
    - mvn -pl "${SERVICE_NAME}" -am -DskipTests -Dmaven.test.skip=true clean install

.test_template:
  extends: .job_template
  stage: test
  script:
    - mvn -pl "${SERVICE_NAME}" -am test

.docker_build_template:
  extends: .docker_template
  stage: docker_build
  script:
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE_PATH}" --no-push

.docker_publish_template:
  extends: .docker_template
  stage: docker_publish
  only:
    - main
  script:
    - test -n "${QUAY_NAMESPACE}" || (echo "Missing QUAY_NAMESPACE CI/CD variable" && exit 1)
    - test -n "${QUAY_USERNAME}" || (echo "Missing QUAY_USERNAME CI/CD variable" && exit 1)
    - test -n "${QUAY_PASSWORD}" || (echo "Missing QUAY_PASSWORD CI/CD variable" && exit 1)
    - mkdir -p /kaniko/.docker
    - AUTH="$(printf "%s:%s" "${QUAY_USERNAME}" "${QUAY_PASSWORD}" | base64 | tr -d '\n')"
    - echo "{\"auths\":{\"quay.io\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE_PATH}" --destination "quay.io/${QUAY_NAMESPACE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" --destination "quay.io/${QUAY_NAMESPACE}/${SERVICE_NAME}:latest"

test_customer:
  extends: .test_template
  variables:
    SERVICE_NAME: customer-service

test_harvest:
  extends: .test_template
  variables:
    SERVICE_NAME: harvest-service

test_inventory:
  extends: .test_template
  variables:
    SERVICE_NAME: inventory-service

test_production:
  extends: .test_template
  variables:
    SERVICE_NAME: production-service

build_customer:
  extends: .build_template
  variables:
    SERVICE_NAME: customer-service

build_harvest:
  extends: .build_template
  variables:
    SERVICE_NAME: harvest-service

build_inventory:
  extends: .build_template
  variables:
    SERVICE_NAME: inventory-service

build_production:
  extends: .build_template
  variables:
    SERVICE_NAME: production-service

docker_harvest:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: harvest-service
    DOCKERFILE_PATH: harvest-service/Dockerfile
    IMAGE_NAME: winery-management/harvest-service:${CI_COMMIT_SHORT_SHA}

docker_inventory:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: inventory-service
    DOCKERFILE_PATH: inventory-service/Dockerfile
    IMAGE_NAME: winery-management/inventory-service:${CI_COMMIT_SHORT_SHA}

docker_production:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: production-service
    DOCKERFILE_PATH: production-service/Dockerfile
    IMAGE_NAME: winery-management/production-service:${CI_COMMIT_SHORT_SHA}

docker_customer:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: customer-service
    DOCKERFILE_PATH: customer-service/Dockerfile
    IMAGE_NAME: winery-management/customer-service:${CI_COMMIT_SHORT_SHA}

publish_harvest:
  extends: .docker_publish_template
  variables:
    SERVICE_NAME: harvest-service
    DOCKERFILE_PATH: harvest-service/Dockerfile

publish_inventory:
  extends: .docker_publish_template
  variables:
    SERVICE_NAME: inventory-service
    DOCKERFILE_PATH: inventory-service/Dockerfile

publish_production:
  extends: .docker_publish_template
  variables:
    SERVICE_NAME: production-service
    DOCKERFILE_PATH: production-service/Dockerfile

publish_customer:
  extends: .docker_publish_template
  variables:
    SERVICE_NAME: customer-service
    DOCKERFILE_PATH: customer-service/Dockerfile
