image: maven:3.9.9-eclipse-temurin-25

stages:
  - build
  - run

# ---------------- BUILD ----------------

build_customer:
  stage: build
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - mvn -pl customer-service -am clean install

build_harvest:
  stage: build
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - mvn -pl harvest-service -am clean install

build_inventory:
  stage: build
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - mvn -pl inventory-service -am clean install

build_production:
  stage: build
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - mvn -pl production-service -am clean install

# ---------------- RUN ----------------

run_customer:
  stage: run
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - cd customer-service
    - mvn spring-boot:run > log.txt 2>&1 &
    - sleep 60
    - grep "Started" log.txt

run_harvest:
  stage: run
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - cd harvest-service
    - mvn spring-boot:run > log.txt 2>&1 &
    - sleep 60
    - grep "Started" log.txt

run_inventory:
  stage: run
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - cd inventory-service
    - mvn spring-boot:run > log.txt 2>&1 &
    - sleep 60
    - grep "Started" log.txt

run_production:
  stage: run
  tags: [ shared-fi ]
  only:
    - main
    - merge_requests
  script:
    - cd production-service
    - mvn spring-boot:run > log.txt 2>&1 &
    - sleep 60
    - grep "Started" log.txt
