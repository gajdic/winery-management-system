default:
  image: maven:3.9.12-eclipse-temurin-25
  tags: [ shared-fi ]

stages:
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  STARTUP_TIMEOUT_SECONDS: "90"

cache:
  key: "${CI_PROJECT_ID}-maven"
  paths:
    - .m2/repository

.job_template:
  only:
    - main
    - merge_requests

.docker_template:
  extends: .job_template
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

.build_template:
  extends: .job_template
  stage: build
  script:
    - mvn -pl "${SERVICE_NAME}" -am clean install

.docker_build_template:
  extends: .docker_template
  stage: docker
  script:
    - docker build -f "${DOCKERFILE_PATH}" -t "${IMAGE_NAME}" .

build_customer:
  extends: .build_template
  variables:
    SERVICE_NAME: customer-service

build_harvest:
  extends: .build_template
  variables:
    SERVICE_NAME: harvest-service

build_inventory:
  extends: .build_template
  variables:
    SERVICE_NAME: inventory-service

build_production:
  extends: .build_template
  variables:
    SERVICE_NAME: production-service

docker_harvest:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: harvest-service
    DOCKERFILE_PATH: harvest-service/Dockerfile
    IMAGE_NAME: winery-management/harvest-service:${CI_COMMIT_SHORT_SHA}

docker_production:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: production-service
    DOCKERFILE_PATH: production-service/Dockerfile
    IMAGE_NAME: winery-management/production-service:${CI_COMMIT_SHORT_SHA}
