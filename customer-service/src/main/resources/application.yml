server:
  port: 8084

spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:h2:mem:customer-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

---
# Activates Liquibase seed context (changeset 002 with realistic demo data)
# run with: mvn -pl customer-service spring-boot:run -Dspring-boot.run.profiles=seed
spring:
  config:
    activate:
      on-profile: seed
  liquibase:
    contexts: seed
