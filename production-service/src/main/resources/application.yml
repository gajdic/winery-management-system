server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: production-service
  datasource:
    url: jdbc:h2:mem:production-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis
  jms:
    template:
      default-destination: batch-completed-queue
      session-transacted: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---

spring:
  config:
    activate:
      on-profile: seed
  liquibase:
    contexts: seed
