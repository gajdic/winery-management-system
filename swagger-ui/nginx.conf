server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /swagger-ui.html {
        try_files /index.html =404;
    }

    location = /swagger-ui/oauth2-redirect.html {
        try_files /oauth2-redirect.html =404;
    }

    location = /api-docs/customer {
        proxy_pass http://customer-service:8084/v3/api-docs;
    }

    location = /api-docs/harvest {
        proxy_pass http://harvest-service:8081/v3/api-docs;
    }

    location = /api-docs/production {
        proxy_pass http://production-service:8082/api/v3/api-docs;
    }

    location = /api-docs/inventory {
        proxy_pass http://inventory-service:8083/inventory-service/api/v1/api-docs;
    }

    location /customer-api/ {
        proxy_pass http://customer-service:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /harvest-api/ {
        proxy_pass http://harvest-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /production-api/ {
        proxy_pass http://production-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inventory-api/ {
        proxy_pass http://inventory-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
