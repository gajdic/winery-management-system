server:
  port: 8081

spring:
  application:
    name: harvest-service
  datasource:
    url: jdbc:h2:mem:harvest-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id.muni.cz/oidc/
          audiences: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
        opaque-token:
          introspection-uri: https://id.muni.cz/oidc/introspect
          client-id: d57b3a8f-156e-46de-9f27-39c4daee05e1
          client-secret: fa228ebc-4d54-4cda-901e-4d6287f8b1652a9c9c44-73c9-4502-973f-bcdb4a8ec96a

springdoc:
  swagger-ui:
    oauth:
      client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
      client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
      scopes:
        - openid
        - test_read
        - test_write

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

---

spring:
  config:
    activate:
      on-profile: seed
  liquibase:
    contexts: seed
