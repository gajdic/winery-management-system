server:
  port: 8083
  servlet:
    context-path: /inventory-service/api

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  h2:
    console:
      enabled: true
      path: /h2-console
  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis
  jms:
    template:
      default-destination: batch-completed-queue
    listener:
      acknowledge-mode: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id.muni.cz/oidc/
          audiences: 7e02a0a9-446a-412d-ad2b-90add47b0fdd

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
      client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
      scopes:
        - openid
        - test_read
        - test_write

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

---
# Activates Liquibase seed context (changeset 002 with realistic demo data)
# run with: mvn -pl inventory-service spring-boot:run -Dspring-boot.run.profiles=seed
spring:
  config:
    activate:
      on-profile: seed
  liquibase:
    contexts: seed

---
# For generating Bearer token for Swagger UI testing
# run with: mvn -pl inventory-service spring-boot:run -Dspring-boot.run.profiles=swagger
spring:
  config:
    activate:
      on-profile: swagger
server:
  port: 8090
  servlet:
    context-path: /
