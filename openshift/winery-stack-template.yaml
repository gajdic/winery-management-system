apiVersion: template.openshift.io/v1
kind: Template
metadata:
    name: winery-management-system
    annotations:
        description: OpenShift deployment for the Winery Management System services.
labels:
    app.kubernetes.io/part-of: winery-management-system
objects:
    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: artemis
            labels:
                app: artemis
                app.kubernetes.io/name: artemis
                app.kubernetes.io/component: messaging
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: artemis
            template:
                metadata:
                    labels:
                        app: artemis
                        app.kubernetes.io/name: artemis
                        app.kubernetes.io/component: messaging
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: artemis
                            image: apache/artemis:2.53.0-alpine
                            workingDir: /tmp
                            ports:
                                -   containerPort: 61616
                                    protocol: TCP
                                -   containerPort: 8161
                                    protocol: TCP
                            env:
                                -   name: ARTEMIS_USER
                                    value: artemis
                                -   name: ARTEMIS_PASSWORD
                                    value: artemis
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 250m
                                    memory: 512Mi
                            readinessProbe:
                                tcpSocket:
                                    port: 61616
                                initialDelaySeconds: 20
                                periodSeconds: 10
                            livenessProbe:
                                tcpSocket:
                                    port: 61616
                                initialDelaySeconds: 60
                                periodSeconds: 20
    -   apiVersion: v1
        kind: Service
        metadata:
            name: artemis
            labels:
                app: artemis
                app.kubernetes.io/name: artemis
                app.kubernetes.io/component: messaging
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: artemis
            ports:
                -   name: core
                    port: 61616
                    targetPort: 61616
                -   name: console
                    port: 8161
                    targetPort: 8161

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: customer-service
            labels:
                app: customer-service
                app.kubernetes.io/name: customer-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: customer-service
            template:
                metadata:
                    labels:
                        app: customer-service
                        app.kubernetes.io/name: customer-service
                        app.kubernetes.io/component: api
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: customer-service
                            image: quay.io/${QUAY_NAMESPACE}/customer-service:${IMAGE_TAG}
                            ports:
                                -   containerPort: 8084
                                    protocol: TCP
                            env:
                                -   name: SPRING_DATASOURCE_URL
                                    value: jdbc:h2:mem:customer-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                tcpSocket:
                                    port: 8084
                                initialDelaySeconds: 40
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                tcpSocket:
                                    port: 8084
                                initialDelaySeconds: 90
                                periodSeconds: 20
                                failureThreshold: 6
    -   apiVersion: v1
        kind: Service
        metadata:
            name: customer-service
            labels:
                app: customer-service
                app.kubernetes.io/name: customer-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: customer-service
            ports:
                -   name: http
                    port: 8084
                    targetPort: 8084
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: customer-service
            labels:
                app: customer-service
                app.kubernetes.io/name: customer-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: customer-service
            port:
                targetPort: http

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: harvest-service
            labels:
                app: harvest-service
                app.kubernetes.io/name: harvest-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: harvest-service
            template:
                metadata:
                    labels:
                        app: harvest-service
                        app.kubernetes.io/name: harvest-service
                        app.kubernetes.io/component: api
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: harvest-service
                            image: quay.io/${QUAY_NAMESPACE}/harvest-service:${IMAGE_TAG}
                            ports:
                                -   containerPort: 8081
                                    protocol: TCP
                            env:
                                -   name: SPRING_DATASOURCE_URL
                                    value: jdbc:h2:mem:harvest-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                tcpSocket:
                                    port: 8081
                                initialDelaySeconds: 40
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                tcpSocket:
                                    port: 8081
                                initialDelaySeconds: 90
                                periodSeconds: 20
                                failureThreshold: 6
    -   apiVersion: v1
        kind: Service
        metadata:
            name: harvest-service
            labels:
                app: harvest-service
                app.kubernetes.io/name: harvest-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: harvest-service
            ports:
                -   name: http
                    port: 8081
                    targetPort: 8081
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: harvest-service
            labels:
                app: harvest-service
                app.kubernetes.io/name: harvest-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: harvest-service
            port:
                targetPort: http

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: inventory-service
            labels:
                app: inventory-service
                app.kubernetes.io/name: inventory-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: inventory-service
            template:
                metadata:
                    labels:
                        app: inventory-service
                        app.kubernetes.io/name: inventory-service
                        app.kubernetes.io/component: api
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: inventory-service
                            image: quay.io/${QUAY_NAMESPACE}/inventory-service:${IMAGE_TAG}
                            ports:
                                -   containerPort: 8083
                                    protocol: TCP
                            env:
                                -   name: SPRING_DATASOURCE_URL
                                    value: jdbc:h2:mem:inventory-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
                                -   name: SPRING_ARTEMIS_MODE
                                    value: native
                                -   name: SPRING_ARTEMIS_BROKER_URL
                                    value: tcp://artemis:61616
                                -   name: SPRING_ARTEMIS_USER
                                    value: artemis
                                -   name: SPRING_ARTEMIS_PASSWORD
                                    value: artemis
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                tcpSocket:
                                    port: 8083
                                initialDelaySeconds: 40
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                tcpSocket:
                                    port: 8083
                                initialDelaySeconds: 90
                                periodSeconds: 20
                                failureThreshold: 6
    -   apiVersion: v1
        kind: Service
        metadata:
            name: inventory-service
            labels:
                app: inventory-service
                app.kubernetes.io/name: inventory-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: inventory-service
            ports:
                -   name: http
                    port: 8083
                    targetPort: 8083
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: inventory-service
            labels:
                app: inventory-service
                app.kubernetes.io/name: inventory-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: inventory-service
            port:
                targetPort: http

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: production-service
            labels:
                app: production-service
                app.kubernetes.io/name: production-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: production-service
            template:
                metadata:
                    labels:
                        app: production-service
                        app.kubernetes.io/name: production-service
                        app.kubernetes.io/component: api
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: production-service
                            image: quay.io/${QUAY_NAMESPACE}/production-service:${IMAGE_TAG}
                            ports:
                                -   containerPort: 8082
                                    protocol: TCP
                            env:
                                -   name: SPRING_DATASOURCE_URL
                                    value: jdbc:h2:mem:production-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
                                -   name: SPRING_ARTEMIS_MODE
                                    value: native
                                -   name: SPRING_ARTEMIS_BROKER_URL
                                    value: tcp://artemis:61616
                                -   name: SPRING_ARTEMIS_USER
                                    value: artemis
                                -   name: SPRING_ARTEMIS_PASSWORD
                                    value: artemis
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                tcpSocket:
                                    port: 8082
                                initialDelaySeconds: 40
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                tcpSocket:
                                    port: 8082
                                initialDelaySeconds: 90
                                periodSeconds: 20
                                failureThreshold: 6
    -   apiVersion: v1
        kind: Service
        metadata:
            name: production-service
            labels:
                app: production-service
                app.kubernetes.io/name: production-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: production-service
            ports:
                -   name: http
                    port: 8082
                    targetPort: 8082
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: production-service
            labels:
                app: production-service
                app.kubernetes.io/name: production-service
                app.kubernetes.io/component: api
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: production-service
            port:
                targetPort: http

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: prometheus
            labels:
                app: prometheus
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: prometheus
            template:
                metadata:
                    labels:
                        app: prometheus
                        app.kubernetes.io/name: prometheus
                        app.kubernetes.io/component: monitoring
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: prometheus
                            image: prom/prometheus:v2.55.1
                            args:
                                - --config.file=/etc/prometheus/prometheus.yml
                                - --storage.tsdb.path=/tmp/prometheus
                            ports:
                                -   containerPort: 9090
                                    protocol: TCP
                            volumeMounts:
                                -   name: prometheus-config
                                    mountPath: /etc/prometheus/prometheus.yml
                                    subPath: prometheus.yml
                                    readOnly: true
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                httpGet:
                                    path: /-/ready
                                    port: 9090
                                initialDelaySeconds: 20
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                httpGet:
                                    path: /-/healthy
                                    port: 9090
                                initialDelaySeconds: 60
                                periodSeconds: 20
                                failureThreshold: 6
                    volumes:
                        -   name: prometheus-config
                            configMap:
                                name: prometheus-config
    -   apiVersion: v1
        kind: Service
        metadata:
            name: prometheus
            labels:
                app: prometheus
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: prometheus
            ports:
                -   name: http
                    port: 9090
                    targetPort: 9090
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: prometheus
            labels:
                app: prometheus
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: prometheus
            port:
                targetPort: http

    -   apiVersion: apps/v1
        kind: Deployment
        metadata:
            name: grafana
            labels:
                app: grafana
                app.kubernetes.io/name: grafana
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            replicas: 1
            selector:
                matchLabels:
                    app: grafana
            template:
                metadata:
                    labels:
                        app: grafana
                        app.kubernetes.io/name: grafana
                        app.kubernetes.io/component: monitoring
                        app.kubernetes.io/part-of: winery-management-system
                spec:
                    containers:
                        -   name: grafana
                            image: grafana/grafana:11.3.0
                            ports:
                                -   containerPort: 3000
                                    protocol: TCP
                            env:
                                -   name: GF_SECURITY_ADMIN_USER
                                    value: admin
                                -   name: GF_SECURITY_ADMIN_PASSWORD
                                    value: admin
                                -   name: GF_USERS_ALLOW_SIGN_UP
                                    value: "false"
                                -   name: GF_PATHS_DATA
                                    value: /tmp/grafana-data
                                -   name: GF_PATHS_LOGS
                                    value: /tmp/grafana-logs
                                -   name: GF_PATHS_PLUGINS
                                    value: /tmp/grafana-plugins
                            volumeMounts:
                                -   name: grafana-datasources
                                    mountPath: /etc/grafana/provisioning/datasources
                                    readOnly: true
                                -   name: grafana-dashboard-providers
                                    mountPath: /etc/grafana/provisioning/dashboards
                                    readOnly: true
                                -   name: grafana-dashboards
                                    mountPath: /tmp/grafana-dashboards
                                    readOnly: true
                            resources:
                                requests:
                                    cpu: 50m
                                    memory: 256Mi
                                limits:
                                    cpu: 500m
                                    memory: 768Mi
                            readinessProbe:
                                httpGet:
                                    path: /api/health
                                    port: 3000
                                initialDelaySeconds: 30
                                periodSeconds: 10
                                failureThreshold: 6
                            livenessProbe:
                                httpGet:
                                    path: /api/health
                                    port: 3000
                                initialDelaySeconds: 60
                                periodSeconds: 20
                                failureThreshold: 6
                    volumes:
                        -   name: grafana-datasources
                            configMap:
                                name: grafana-datasources
                        -   name: grafana-dashboard-providers
                            configMap:
                                name: grafana-dashboard-providers
                        -   name: grafana-dashboards
                            configMap:
                                name: grafana-dashboards
    -   apiVersion: v1
        kind: Service
        metadata:
            name: grafana
            labels:
                app: grafana
                app.kubernetes.io/name: grafana
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            selector:
                app: grafana
            ports:
                -   name: http
                    port: 3000
                    targetPort: 3000
    -   apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
            name: grafana
            labels:
                app: grafana
                app.kubernetes.io/name: grafana
                app.kubernetes.io/component: monitoring
                app.kubernetes.io/part-of: winery-management-system
        spec:
            tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect
            to:
                kind: Service
                name: grafana
            port:
                targetPort: http
parameters:
    -   name: QUAY_NAMESPACE
        displayName: Quay namespace
        description: Quay user or organization that owns the service image repositories.
        required: true
    -   name: IMAGE_TAG
        displayName: Image tag
        description: Image tag to deploy from Quay.
        value: latest
